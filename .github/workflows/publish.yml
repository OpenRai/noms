name: Publish packages

on:
  push:
    tags:
      - "npm-v*"
      - "noms-v*"
      - "noms-cli-v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conformance:
    uses: ./.github/workflows/conformance.yml
    with:
      extended: true
  verify:
    if: github.repository == 'OpenRai/noms'
    needs: conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify committed Standards provenance
        run: node scripts/check-fixtures.mjs --release
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check release tag
        run: |
          case "$GITHUB_REF_NAME" in
            npm-v*) node scripts/check-release-tag.mjs npm ;;
            noms-v*) node scripts/check-release-tag.mjs noms ;;
            noms-cli-v*) node scripts/check-release-tag.mjs noms-cli ;;
            *) exit 1 ;;
          esac
      - name: Pack npm package
        if: startsWith(github.ref, 'refs/tags/npm-v')
        working-directory: packages/typescript
        run: mkdir -p artifacts && npm pack --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/npm-v')
        with:
          name: npm-package
          path: packages/typescript/artifacts/*.tgz
          if-no-files-found: error

  npm:
    if: github.repository == 'OpenRai/noms' && startsWith(github.ref, 'refs/tags/npm-v')
    needs: verify
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifacts
      - name: Check npm OIDC support
        run: node scripts/check-npm-version.mjs
      - name: Publish npm package with OIDC
        run: npm publish ./artifacts/*.tgz --provenance --ignore-scripts

  noms-crate:
    if: github.repository == 'OpenRai/noms' && startsWith(github.ref, 'refs/tags/noms-v')
    needs: verify
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Check release tag
        run: node scripts/check-release-tag.mjs noms
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish noms library with OIDC
        run: cargo publish --locked --no-verify -p noms
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  noms-cli-crate:
    if: github.repository == 'OpenRai/noms' && startsWith(github.ref, 'refs/tags/noms-cli-v')
    needs: verify
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Check release tag
        run: node scripts/check-release-tag.mjs noms-cli
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish noms CLI with OIDC
        run: cargo publish --locked --no-verify -p noms-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
