[package]
name = "noms"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Nano Off-chain Message Signing reference implementation"
readme = "README.md"
homepage = "https://github.com/OpenRai/noms"
repository = "https://github.com/OpenRai/noms"
documentation = "https://docs.rs/noms"
